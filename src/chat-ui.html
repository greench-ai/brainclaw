<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Brainclaw Team Chat</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'IBM Plex Mono', 'Fira Code', monospace; background: #0a0a0f; color: #e0e0e0; height: 100vh; display: flex; flex-direction: column; }
    header { background: #111118; border-bottom: 1px solid #2a2a3a; padding: 12px 16px; display: flex; align-items: center; gap: 12px; }
    header h1 { font-size: 14px; color: #00ff88; font-weight: 600; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #444; }
    .status-dot.connected { background: #00ff88; box-shadow: 0 0 6px #00ff88; }
    .status-dot.disconnected { background: #ff4444; }
    .channels { display: flex; gap: 6px; }
    .channel-btn { background: #1a1a24; border: 1px solid #2a2a3a; color: #888; padding: 4px 10px; border-radius: 4px; font-size: 11px; cursor: pointer; font-family: inherit; }
    .channel-btn.active { background: #1a3a2a; border-color: #00ff88; color: #00ff88; }
    .channel-btn:hover { border-color: #444; }
    #messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
    .msg { padding: 8px 12px; border-radius: 8px; max-width: 75%; font-size: 13px; line-height: 1.5; }
    .msg.others { background: #16161e; border: 1px solid #22222e; align-self: flex-start; }
    .msg.mine { background: #0d2a1a; border: 1px solid #00ff8844; align-self: flex-end; color: #a0ffc0; }
    .msg.system { background: #1a1a24; border: 1px dashed #333; color: #666; font-size: 11px; align-self: center; text-align: center; }
    .msg .from { font-size: 10px; color: #00ff88; font-weight: 600; margin-bottom: 2px; }
    .msg.mine .from { color: #60d090; }
    .msg .time { font-size: 10px; color: #444; margin-top: 2px; }
    #input-area { background: #111118; border-top: 1px solid #2a2a3a; padding: 12px 16px; display: flex; gap: 8px; }
    #msg-input { flex: 1; background: #0a0a0f; border: 1px solid #2a2a3a; color: #e0e0e0; padding: 10px 14px; border-radius: 8px; font-family: inherit; font-size: 13px; outline: none; }
    #msg-input:focus { border-color: #00ff8855; }
    #send-btn { background: #00ff88; color: #0a0a0f; border: none; padding: 10px 20px; border-radius: 8px; font-family: inherit; font-weight: 600; cursor: pointer; font-size: 13px; }
    #send-btn:hover { background: #00cc6e; }
    .join-banner { text-align: center; padding: 8px; background: #1a1a24; color: #555; font-size: 11px; border-bottom: 1px solid #222; }
    .info-bar { font-size: 11px; color: #444; text-align: center; padding: 4px; }
  </style>
</head>
<body>
  <header>
    <h1>⚔️ Brainclaw Team</h1>
    <div class="status-dot disconnected" id="ws-status"></div>
    <div class="channels">
      <button class="channel-btn active" data-channel="team">#team</button>
      <button class="channel-btn" data-channel="fuma">Fuma</button>
      <button class="channel-btn" data-channel="kojiro">Kojiro</button>
      <button class="channel-btn" data-channel="sasuke">Sasuke</button>
      <button class="channel-btn" data-channel="nexus">Nexus</button>
    </div>
  </header>
  <div class="join-banner" id="join-banner">Set your name in the prompt below, then click Send to join</div>
  <div id="messages">
    <div class="msg system">Brainclaw Team Chat — connect to start chatting</div>
  </div>
  <div class="info-bar" id="info-bar"></div>
  <div id="input-area">
    <input id="msg-input" placeholder="Your name (first time) or message..." />
    <button id="send-btn">Join</button>
  </div>

  <script type="module">
    const WS_URL = `ws://${window.location.host}/ws`;
    let ws;
    let myName = null;
    let currentChannel = 'team';

    const statusDot = document.getElementById('ws-status');
    const messagesEl = document.getElementById('messages');
    const inputEl = document.getElementById('msg-input');
    const sendBtn = document.getElementById('send-btn');
    const joinBanner = document.getElementById('join-banner');
    const infoBar = document.getElementById('info-bar');

    function connect() {
      ws = new WebSocket(WS_URL);

      ws.onopen = () => {
        statusDot.className = 'status-dot connected';
        infoBar.textContent = `Connected to Brainclaw pub/sub — tuned to #${currentChannel}`;
        // Register as the name provided
        if (myName) {
          ws.send(JSON.stringify({ type: 'register', agentId: myName.toLowerCase().replace(/\s+/g,'_'), label: myName }));
          ws.send(JSON.stringify({ type: 'subscribe', channel: currentChannel }));
        }
      };

      ws.onmessage = (event) => {
        const msg = JSON.parse(event.data);
        if (msg.type === 'broadcast' && (msg.channel === currentChannel || msg.channel === 'team')) {
          addMessage(msg.from, msg.text, msg.ts, msg.from === myName);
        }
        if (msg.type === 'welcome') {
          console.log('Brainclaw welcome:', msg);
        }
      };

      ws.onclose = () => {
        statusDot.className = 'status-dot disconnected';
        infoBar.textContent = 'Disconnected — reconnecting in 3s...';
        setTimeout(connect, 3000);
      };

      ws.onerror = () => {
        statusDot.className = 'status-dot disconnected';
      };
    }

    function addMessage(from, text, ts, mine) {
      const div = document.createElement('div');
      div.className = `msg ${mine ? 'mine' : 'others'}`;
      const time = ts ? new Date(ts).toLocaleTimeString() : '';
      div.innerHTML = `<div class="from">${from}</div><div>${escapeHtml(text)}</div>${time ? `<div class="time">${time}</div>` : ''}`;
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function escapeHtml(text) {
      return text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function send() {
      const text = inputEl.value.trim();
      if (!text) return;

      if (!myName) {
        // First message = name registration
        myName = text;
        joinBanner.style.display = 'none';
        inputEl.placeholder = 'Type a message...';
        sendBtn.textContent = 'Send';
        inputEl.value = '';
        // Register and subscribe
        ws.send(JSON.stringify({ type: 'register', agentId: myName.toLowerCase().replace(/\s+/g,'_'), label: myName }));
        ws.send(JSON.stringify({ type: 'subscribe', channel: currentChannel }));
        addMessage('system', `Joined as ${myName} — tuned to #${currentChannel}`, null, false);
        return;
      }

      ws.send(JSON.stringify({ type: 'broadcast', channel: currentChannel, text }));
      addMessage(myName, text, Date.now(), true);
      inputEl.value = '';
    }

    // Channel switching
    document.querySelectorAll('.channel-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.channel-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentChannel = btn.dataset.channel;
        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({ type: 'subscribe', channel: currentChannel }));
        }
        infoBar.textContent = `Tuned to #${currentChannel}`;
        messagesEl.querySelectorAll('.msg:not(.system)').forEach(m => m.remove());
      });
    });

    sendBtn.addEventListener('click', send);
    inputEl.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });

    connect();
  </script>
</body>
</html>
